<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Simplified block diagram of a 4 row by 6 column SRAM array with a row decoder and a column decoder">
  <rect width="800" height="600" fill="#f7f6f5"/>
  <text x="400" y="42" text-anchor="middle" font-family="monospace" font-size="22" fill="#222">4 x 6 SRAM array</text>
  <text x="400" y="68" text-anchor="middle" font-family="monospace" font-size="14" fill="#666">simplified block diagram</text>

  <!-- word lines (one per row) -->
  <g stroke="#555" stroke-width="2">
    <line x1="170" y1="160" x2="740" y2="160"/>
    <line x1="170" y1="240" x2="740" y2="240"/>
    <line x1="170" y1="320" x2="740" y2="320"/>
    <line x1="170" y1="400" x2="740" y2="400"/>
  </g>
  <!-- bit lines (one per column) -->
  <g stroke="#555" stroke-width="2">
    <line x1="300" y1="120" x2="300" y2="500"/>
    <line x1="380" y1="120" x2="380" y2="500"/>
    <line x1="460" y1="120" x2="460" y2="500"/>
    <line x1="540" y1="120" x2="540" y2="500"/>
    <line x1="620" y1="120" x2="620" y2="500"/>
    <line x1="700" y1="120" x2="700" y2="500"/>
  </g>

  <!-- cells -->
  <g fill="#ffffff" stroke="#333" stroke-width="2">
    <rect x="272" y="138" width="56" height="44" rx="6"/><rect x="352" y="138" width="56" height="44" rx="6"/><rect x="432" y="138" width="56" height="44" rx="6"/><rect x="512" y="138" width="56" height="44" rx="6"/><rect x="592" y="138" width="56" height="44" rx="6"/><rect x="672" y="138" width="56" height="44" rx="6"/>
    <rect x="272" y="218" width="56" height="44" rx="6"/><rect x="352" y="218" width="56" height="44" rx="6"/><rect x="432" y="218" width="56" height="44" rx="6"/><rect x="512" y="218" width="56" height="44" rx="6"/><rect x="592" y="218" width="56" height="44" rx="6"/><rect x="672" y="218" width="56" height="44" rx="6"/>
    <rect x="272" y="298" width="56" height="44" rx="6"/><rect x="352" y="298" width="56" height="44" rx="6"/><rect x="432" y="298" width="56" height="44" rx="6"/><rect x="512" y="298" width="56" height="44" rx="6"/><rect x="592" y="298" width="56" height="44" rx="6"/><rect x="672" y="298" width="56" height="44" rx="6"/>
    <rect x="272" y="378" width="56" height="44" rx="6"/><rect x="352" y="378" width="56" height="44" rx="6"/><rect x="432" y="378" width="56" height="44" rx="6"/><rect x="512" y="378" width="56" height="44" rx="6"/><rect x="592" y="378" width="56" height="44" rx="6"/><rect x="672" y="378" width="56" height="44" rx="6"/>
  </g>
  <g font-family="monospace" font-size="13" fill="#444" text-anchor="middle">
    <text x="300" y="165">cell</text><text x="380" y="165">cell</text><text x="460" y="165">cell</text><text x="540" y="165">cell</text><text x="620" y="165">cell</text><text x="700" y="165">cell</text>
  </g>

  <!-- row decoder -->
  <rect x="50" y="120" width="120" height="320" rx="8" fill="#d9d5d2" stroke="#333" stroke-width="2"/>
  <text x="110" y="270" text-anchor="middle" font-family="monospace" font-size="18" fill="#222">Row</text>
  <text x="110" y="294" text-anchor="middle" font-family="monospace" font-size="18" fill="#222">decoder</text>
  <g font-family="monospace" font-size="13" fill="#444" text-anchor="end">
    <text x="236" y="152">WL0</text><text x="236" y="232">WL1</text><text x="236" y="312">WL2</text><text x="236" y="392">WL3</text>
  </g>
  <g stroke="#333" stroke-width="2" fill="#333">
    <line x1="8" y1="280" x2="46" y2="280"/><polygon points="50,280 40,275 40,285" stroke="none"/>
  </g>
  <text x="50" y="108" font-family="monospace" font-size="13" fill="#444">row addr</text>

  <!-- column decoder -->
  <rect x="260" y="500" width="480" height="56" rx="8" fill="#d9d5d2" stroke="#333" stroke-width="2"/>
  <text x="500" y="535" text-anchor="middle" font-family="monospace" font-size="18" fill="#222">Column decoder</text>
  <g stroke="#333" stroke-width="2" fill="#333">
    <line x1="150" y1="528" x2="256" y2="528"/><polygon points="260,528 250,523 250,533" stroke="none"/>
  </g>
  <text x="150" y="518" font-family="monospace" font-size="13" fill="#444">col addr</text>
</svg>
